name: push_conf_daily

# =============================================================================
# 搜广推顶会论文 · 每日推送（自包含版）
# OpenAlex 取数 -> 彩云小译翻译 -> 飞书机器人卡片，不依赖私有接口与 Git LFS。
#
# 必填 Secrets：FEISHU_URL、CAIYUN_TOKEN
# 选填 Secrets：OPENALEX_MAILTO（建议填邮箱，进入 OpenAlex 礼貌池）
# 配套文件：feishu_digest.py
# 本地版（计划任务）说明见同目录《配置说明.md》
# =============================================================================

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00；GitHub 定时任务可能延迟 5$30 分钟
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "演练模式：只打印不发送、不提交"
        type: boolean
        default: false
      limits:
        description: "本次最多推送篇数"
        type: string
        default: "5"
      confs:
        description: "目标会议（英文逗号分隔）"
        type: string
        default: "sigir,kdd,www,cikm,recsys,wsdm"

concurrency:
  group: push_conf_daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FEISHU_URL: ${{ secrets.FEISHU_URL }}
      CAIYUN_TOKEN: ${{ secrets.CAIYUN_TOKEN }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      CONFS: ${{ inputs.confs || 'sigir,kdd,www,cikm,recsys,wsdm' }}
      LIMITS: ${{ inputs.limits || '5' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      PUSH_INTERVAL: "3"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 运行信息
        run: |
          echo "event        : ${{ github.event_name }}"
          echo "repository   : ${{ github.repository }} @ ${{ github.ref_name }}"
          echo "UTC time     : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Beijing time : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "CONFS=${CONFS} LIMITS=${LIMITS} DRY_RUN=${DRY_RUN}"

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --upgrade pip requests

      - name: 检查 Secrets
        run: |
          missing=""
          [ -n "${FEISHU_URL:-}" ] || missing="${missing} FEISHU_URL"
          [ -n "${CAIYUN_TOKEN:-}" ] || missing="${missing} CAIYUN_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets:${missing}。请到 Settings > Secrets and variables > Actions 添加。"
            exit 1
          fi
          echo "Secrets 检查通过；飞书机器人数量：$(echo "${FEISHU_URL}" | tr ',' '\n' | grep -c .)"

      - name: 推送顶会论文
        run: |
          set -eo pipefail
          python feishu_digest.py --limits "${LIMITS}"

      - name: 提交状态文件
        id: commit
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          STATE="data/digest_state.json"
          git add "$STATE" || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "状态无变化，跳过提交"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update paper digest state $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送回仓库
        if: env.DRY_RUN != 'true' && steps.commit.outputs.push == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "推送成功"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次推送失败，rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 10))
          done
          echo "::error::推送重试 3 次仍失败，请检查分支保护规则"
          exit 1

      - name: 失败时通知飞书
        if: failure()
        shell: bash
        run: |
          if [ -z "${FEISHU_URL:-}" ]; then echo "FEISHU_URL 未配置，跳过失败通知"; exit 0; fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="**仓库**：${GITHUB_REPOSITORY}
          **时间**：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')（北京时间）
          **触发**：${GITHUB_EVENT_NAME}
          **详情**：[查看运行日志](${run_url})"
          card=$(jq -nc --arg t "顶会论文推送失败" --arg b "$body" '{config:{wide_screen_mode:true},header:{template:"red",title:{tag:"plain_text",content:$t}},elements:[{tag:"markdown",content:$b}]}')
          payload=$(jq -nc --arg c "$card" '{msg_type:"interactive",card:$c}')
          IFS=',' read -ra urls <<< "${FEISHU_URL}"
          for u in "${urls[@]}"; do
            [ -n "$u" ] || continue
            echo "失败通知发送结果：$(curl -sS -X POST "$u" -H 'Content-Type: application/json' -d "$payload" || echo '发送失败')"
          done